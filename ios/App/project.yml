name: CemuiOS
options:
  bundleIdPrefix: com.cruyfford
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  CemuiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/CemuData
        type: folder
        buildPhase: resources
      - path: Resources/Sounds
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Cemu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIApplicationSupportsIndirectInputEvents: true
        LSApplicationQueriesSchemes:
          - stikdebug
          - sidestore
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Wii U Game
            LSHandlerRank: Owner
            LSItemContentTypes: [com.cruyfford.cemu.wiiu-game]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cruyfford.cemu.wiiu-game
            UTTypeDescription: Wii U Game
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wua, wux, wud, rpx, elf, wuhb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cruyfford.cemu
        PRODUCT_NAME: Cemu
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Cemu-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../../src/ios/bridge"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/../../build-ios/merged"]
        OTHER_LDFLAGS: ["-lCemuAll", "-lc++", "-lz", "-liconv", "-ObjC"]
        CODE_SIGN_ENTITLEMENTS: Resources/Cemu.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: "YES"
        ENABLE_TESTABILITY: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: ZIPFoundation
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreServices.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreMotion.framework
      - sdk: UniformTypeIdentifiers.framework
